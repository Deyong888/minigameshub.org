site:
  name: MiniGamesHub
  site: 'https://minigameshub.org'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: MiniGamesHub — Play 3,900+ Free Online Games Instantly
    template: '%s — MiniGamesHub'
  description: "Discover and play 3,900+ free online mini games, arcade games, puzzle games, and more on MiniGamesHub.org. Instant browser play, no download required! Perfect for work breaks, school free time, or anytime you're bored."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: MiniGamesHub
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
        alt: MiniGamesHub — Free Online Games
    type: website
    locale: en_US
  twitter:
    handle: '@MiniGamesHub'
    site: '@MiniGamesHub'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: 'G-P13CNRCFEP' # GA4 衡量ID (账号 291989547 / 数据流 13588627413)
      partytown: true # 通过 Web Worker 加载，避免阻塞主线程 (Core Web Vitals)

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
